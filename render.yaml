# Render Blueprint for the Astrology Talk backend.
# Render dashboard > New > Blueprint > pick this repo (astro-backend).
services:
  - type: web
    name: astro-backend            # becomes https://astro-backend.onrender.com (Render adds a suffix if the name is taken)
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore              # closest Render region to India
    plan: standard                 # 2 GB RAM: needed for the place database (all Indian villages) + PDF rendering
    healthCheckPath: /api/config
    autoDeploy: true
    disk:                          # keeps the database, reports and downloaded data across deploys
      name: astro-data
      mountPath: /app/data
      sizeGB: 2
    envVars:
      # Public address of the website (your Vercel URL) - used in email and WhatsApp links
      - key: SITE_URL
        sync: false
      - key: SITE_NAME
        value: Astrology Talk
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Admin account created on first start
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REPORT_PRICE
        value: "499"
      - key: CONSULT_PRICE
        value: "999"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Djava.awt.headless=true -Dfile.encoding=UTF-8"
      # Optional - these can also be entered later in Admin > Settings > Integrations (saved on the disk)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
