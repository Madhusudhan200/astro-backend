# Values from .env (same keys as before) are imported as properties
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:3000}

# Database: local H2 file in ./data by default; hosted Postgres (e.g. Neon) when DB_URL / DB_USER / DB_PASSWORD are set
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/kpdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Frontend (HTML/CSS/JS) lives in the sibling ../frontend folder (or FRONTEND_DIR)
spring.web.resources.static-locations=file:${FRONTEND_DIR:../frontend}/,file:frontend/,classpath:/static/
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=true

# Speed: gzip responses
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
server.error.include-message=always

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.kpjyotish=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
spring.task.execution.pool.core-size=6

# Behind Render / Vercel proxies: trust X-Forwarded-* headers (correct https scheme and client IP)
server.forward-headers-strategy=framework

# Small connection pool (free hosted databases allow few connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=300000
